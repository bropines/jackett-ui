name: aio

# All-in-one image: linuxserver.io Jackett + jackett-ui (Dockerfile.aio).
# Rebuilt on UI changes and daily when a new Jackett image is published.
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  aio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the current Jackett image
        id: jackett
        run: |
          docker pull -q lscr.io/linuxserver/jackett:latest
          v=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' lscr.io/linuxserver/jackett:latest)
          [ -n "$v" ] || { echo "no version label"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Jackett image: $v"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip the daily run if this Jackett version is already built
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             docker manifest inspect "ghcr.io/${{ github.repository }}:aio-${{ steps.jackett.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "already built"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.skip.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.skip.outputs.skip != 'true'
      - uses: docker/build-push-action@v6
        if: steps.skip.outputs.skip != 'true'
        with:
          context: .
          file: Dockerfile.aio
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: JACKETT_IMAGE=lscr.io/linuxserver/jackett:${{ steps.jackett.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:aio
            ghcr.io/${{ github.repository }}:aio-${{ steps.jackett.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.jackett.outputs.version }}
          cache-from: type=gha,scope=aio
          cache-to: type=gha,scope=aio,mode=max
