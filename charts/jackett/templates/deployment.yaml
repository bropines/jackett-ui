{{- $expr := include "jackett.settingsExpr" . -}}
{{- $apiKey := .Values.jackett.apiKeySecret.name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jackett.fullname" . }}
  labels:
    {{- include "jackett.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One writer for /config: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "jackett.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jackett.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/settings: {{ printf "%s|%s" $expr $apiKey | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: settings
          image: "{{ .Values.configInit.image.repository }}:{{ .Values.configInit.image.tag }}"
          imagePullPolicy: {{ .Values.configInit.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.runAsUser }}
            runAsGroup: {{ .Values.runAsGroup }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /config/Jackett /config/jackett-ui /config/cardigann/definitions
              f=/config/Jackett/ServerConfig.json
              [ -s "$f" ] || echo '{}' > "$f"
              {{- if $expr }}
              yq -i -p json -o json {{ $expr | squote }} "$f"
              {{- end }}
              {{- if $apiKey }}
              API_KEY="$(cat /run/apikey/key)" yq -i -p json -o json '.APIKey = strenv(API_KEY)' "$f"
              {{- end }}
              echo "ServerConfig.json updated"
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if $apiKey }}
            - name: apikey
              mountPath: /run/apikey
              readOnly: true
            {{- end }}
      containers:
        - name: jackett
          image: "{{ .Values.jackett.image.repository }}:{{ .Values.jackett.image.tag }}"
          imagePullPolicy: {{ .Values.jackett.image.pullPolicy }}
          # The Jackett binary runs directly as PID 1 (like the Go remnanode): no s6-overlay,
          # which cannot start unprivileged with allowPrivilegeEscalation=false. The linuxserver
          # init (PUID/PGID, cron, mods) is not needed here; TMPDIR/HOME go to an emptyDir.
          command: ["/app/Jackett/jackett"]
          args: ["--NoUpdates", "--DataFolder", "/config/Jackett"]
          securityContext:
            runAsUser: {{ .Values.runAsUser }}
            runAsGroup: {{ .Values.runAsGroup }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: TZ, value: {{ .Values.jackett.tz | quote }} }
            - { name: TMPDIR, value: /tmp }
            - { name: HOME, value: /tmp }
            - { name: XDG_CONFIG_HOME, value: /config }
            - { name: XDG_DATA_HOME, value: /config }
            - { name: DOTNET_gcServer, value: "0" }
            {{- with .Values.jackett.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: jackett, containerPort: 9117 }
          readinessProbe:
            tcpSocket: { port: jackett }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: jackett }
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
            - name: jackett-tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.jackett.resources | nindent 12 }}
        - name: ui
          image: {{ include "jackett.uiImage" . }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.runAsUser }}
            runAsGroup: {{ .Values.runAsGroup }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: LISTEN, value: ":8080" }
            - { name: JACKETT_URL, value: "http://127.0.0.1:9117" }
            - { name: DATA_DIR, value: "/data" }
            # Jackett reads custom definitions from $XDG_CONFIG_HOME/cardigann/definitions.
            - { name: CARDIGANN_DIR, value: "/cardigann" }
            {{- with .Values.ingress.host }}
            {{- if $.Values.ingress.enabled }}
            - { name: PUBLIC_URL, value: {{ printf "http%s://%s" (ternary "s" "" (not (empty $.Values.ingress.tls))) . | quote }} }
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.ui.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.ui.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /data
              subPath: jackett-ui
            - name: config
              mountPath: /cardigann
              subPath: cardigann/definitions
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        - name: jackett-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: config
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "jackett.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $apiKey }}
        - name: apikey
          secret:
            secretName: {{ $apiKey }}
            items:
              - { key: {{ .Values.jackett.apiKeySecret.key }}, path: key }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
